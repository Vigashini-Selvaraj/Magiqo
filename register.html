<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Magiqo</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      background: url('https://images.unsplash.com/photo-1608889476561-6242cfdbf622?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80') center/cover no-repeat;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
    }
    .auth-card {
      margin: auto;
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 450px;
      background: rgba(20, 20, 25, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      margin: 40px 0;
    }
    .auth-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 15px;
      margin-top: 20px;
    }
    .auth-title {
      font-family: var(--font-magic);
      font-size: 2.5rem;
      margin-bottom: 5px;
    }
    .text-pink { color: var(--color-primary); -webkit-text-fill-color: var(--color-primary); }
    .text-blue { color: #58A6FF; -webkit-text-fill-color: #58A6FF; }
    
    .auth-subtitle {
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }
    
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-control {
      width: 100%;
      padding: 14px 20px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      font-size: 1rem;
      transition: 0.3s;
    }
    .form-control:focus {
      border-color: var(--color-primary);
      outline: none;
      background: rgba(0, 0, 0, 0.7);
    }
    .form-control::placeholder { color: rgba(255,255,255,0.4); }
    
    .btn-auth {
      width: 100%;
      padding: 15px;
      border-radius: var(--radius-pill);
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 10px;
      margin-bottom: 20px;
    }
    .btn-primary {
      background: var(--color-primary);
      color: white;
    }
    .btn-primary:hover {
      background: #b83a62;
      transform: translateY(-2px);
    }
    
    .divider {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      color: rgba(255, 255, 255, 0.4);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
    }
    .divider::before { margin-right: 15px; }
    .divider::after { margin-left: 15px; }
    
    .btn-social {
      width: 100%;
      padding: 12px 15px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.3s;
      margin-bottom: 15px;
    }
    .btn-social:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .btn-social img {
      width: 20px;
      height: 20px;
    }
    .btn-social i {
      font-size: 1.2rem;
    }
    
    .bottom-link {
      margin-top: 25px;
      color: var(--color-text-light);
      font-size: 0.9rem;
    }
    .bottom-link a {
      color: #58A6FF;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
    }
    .bottom-link a:hover { color: var(--color-primary); }
    
    .home-back {
      position: absolute;
      top: 30px;
      left: 30px;
      color: white;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      opacity: 0.7;
      transition: 0.3s;
      z-index: 3;
    }
    .home-back:hover { opacity: 1; }
  </style>
  <link rel="icon" type="image/png" href="assets/logoooo.png">
</head>
<body data-theme="dark">

  

  <div class="auth-card">
    <a href="index.html" style="display: flex; align-items: center; justify-content: center; margin-bottom: 25px; text-decoration: none;">
      <img src="assets/full logo.png" alt="Magiqo Premium Events Logo" style="height: 85px; width: auto; object-fit: contain;">
    </a>
    <h1 class="auth-title"><span class="text-pink">Join</span> <span class="text-blue">Magiqo</span></h1>
    <p class="auth-subtitle">Create an account to unlock unforgettable magical experiences.</p>
    
    <!-- Prototype Demo Banner -->
    <div style="background: rgba(201, 42, 88, 0.12); border: 1px solid var(--color-primary); color: #fff; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; margin-bottom: 20px; line-height: 1.4; text-align: left;">
      <i class="fa-solid fa-circle-info" style="color: var(--color-primary); margin-right: 6px;"></i>
      <strong>Portfolio Demo:</strong> Registration simulates account creation and directs to dashboard.
    </div>

    <form onsubmit="event.preventDefault(); if(document.getElementById('reg-pwd').value !== document.getElementById('reg-confirm').value) { alert('Passwords do not match!'); return; } window.location.href='user_dashboard.html';">
      <div class="form-group">
        <input type="text" class="form-control" placeholder="Full Name" required value="Sarah Jenkins">
      </div>
      <div class="form-group">
        <input type="email" class="form-control" placeholder="Email Address" required value="sarah.jenkins@example.com">
      </div>
      <div class="form-group">
        <div style="position: relative;">
          <input type="text" id="reg-pwd" class="form-control" placeholder="Password" required value="••••••••" style="padding-right: 40px; -webkit-text-security: disc;">
          <i class="fa-solid fa-eye" style="position: absolute; right: 15px; top: 15px; color: rgba(255,255,255,0.5); cursor: pointer;" onclick="const pwd = document.getElementById('reg-pwd'); if(pwd.style.webkitTextSecurity !== 'none'){ pwd.style.webkitTextSecurity='none'; this.classList.remove('fa-eye'); this.classList.add('fa-eye-slash'); } else { pwd.style.webkitTextSecurity='disc'; this.classList.remove('fa-eye-slash'); this.classList.add('fa-eye'); }"></i>
        </div>
      </div>
      <div class="form-group">
        <div style="position: relative;">
          <input type="text" id="reg-confirm" class="form-control" placeholder="Confirm Password" required value="••••••••" style="padding-right: 40px; -webkit-text-security: disc;">
          <i class="fa-solid fa-eye" style="position: absolute; right: 15px; top: 15px; color: rgba(255,255,255,0.5); cursor: pointer;" onclick="const pwd = document.getElementById('reg-confirm'); if(pwd.style.webkitTextSecurity !== 'none'){ pwd.style.webkitTextSecurity='none'; this.classList.remove('fa-eye'); this.classList.add('fa-eye-slash'); } else { pwd.style.webkitTextSecurity='disc'; this.classList.remove('fa-eye-slash'); this.classList.add('fa-eye'); }"></i>
        </div>
      </div>
      
      <button type="submit" class="btn-auth btn-primary">Sign Up</button>
    </form>
    
    <div class="divider">OR</div>
    
    <button class="btn-social" type="button" onclick="window.location.href='user_dashboard.html';">
      <i class="fa-solid fa-wand-magic-sparkles" style="color: var(--color-primary); margin-right: 8px;"></i>
      Quick Start Demo Account
    </button>
    
    <div class="bottom-link">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

  <script src="js/theme.js"></script>
</body>
</html>
