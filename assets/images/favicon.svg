<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D24B76" />
      <stop offset="100%" stop-color="#FF7CA3" />
    </linearGradient>
    <linearGradient id="gradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3895c8" />
      <stop offset="100%" stop-color="#13315C" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wand body -->
  <line x1="50" y1="150" x2="120" y2="80" stroke="url(#gradBlue)" stroke-width="14" stroke-linecap="round" />
  
  <!-- Wand handle -->
  <line x1="50" y1="150" x2="70" y2="130" stroke="#13315C" stroke-width="18" stroke-linecap="round" />

  <!-- Magic Star at tip -->
  <g transform="translate(130, 70)">
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="url(#gradPink)" filter="url(#glow)"/>
  </g>

  <!-- Small floating sparkles -->
  <g transform="translate(160, 30) scale(0.4)">
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="url(#gradBlue)" />
  </g>
  <g transform="translate(80, 40) scale(0.3)">
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="url(#gradPink)" />
  </g>
  <g transform="translate(140, 120) scale(0.5)">
    <path d="M 0 -35 Q 0 0 35 0 Q 0 0 0 35 Q 0 0 -35 0 Q 0 0 0 -35 Z" fill="#3895c8" />
  </g>
</svg>
    <!-- Brim -->
    <ellipse cx="80" cy="130" rx="65" ry="14" fill="url(#goldHat)" filter="url(#glow)"/>
    
    <!-- Crown Body -->
    <path d="M 40 128 L 45 50 Q 80 40 115 50 L 120 128 Z" fill="url(#goldHat)" />
    
    <!-- White/Silver Hat Band -->
    <path d="M 39 105 L 40 128 Q 80 138 120 128 L 121 105 Q 80 115 39 105 Z" fill="url(#silverBand)" />
    
    <!-- Top of Crown -->
    <ellipse cx="80" cy="50" rx="35" ry="10" fill="#FCEABB" />
  </g>

  <!-- Magic Wand (Crossing Diagonally) -->
  <g filter="url(#glow)">
    <line x1="30" y1="170" x2="170" y2="30" stroke="url(#goldWand)" stroke-width="12" stroke-linecap="round" />
    <!-- White tips -->
    <line x1="30" y1="170" x2="55" y2="145" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
    <line x1="145" y1="55" x2="170" y2="30" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />
  </g>

  <!-- Gold Stars/Sparkles -->
  <g transform="translate(160, 40) scale(0.7)"><use href="#goldStar"/></g>
  <g transform="translate(140, 100) scale(0.4)"><use href="#goldStar"/></g>
  <g transform="translate(40, 30) scale(0.5)"><use href="#goldStar"/></g>
</svg>
